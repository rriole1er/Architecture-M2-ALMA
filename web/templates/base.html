<!DOCTYPE html>
<html>
<head>
    <title>MiniNet</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

<!-- Barre de navigation -->
<div class="navbar">
    {% if session.user %}
    <a href="/feed">Feed</a>
    <a href="/post">Poster</a>
    <a href="/friends">Amis</a>
    <a href="/inbox">Messages</a>
    <a href="/logout">Déconnexion</a>
    {% else %}
    <a href="/login">Connexion</a>
    <a href="/signup">Inscription</a>
    {% endif %}
</div>

<div class="container">
    {% block content %}{% endblock %}
</div>

</body>
</html>
