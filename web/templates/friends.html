{% extends "base.html" %}
{% block content %}


<h2>Mes amis (Follows)</h2>

{% for f in friends %}

<div class="post">
    <div class="post-header" style="display:flex; justify-content:space-between; align-items:center;">
        <div class="post-author">{{ f.pseudo }}</div>
        <form method="post" action="/delete_friend" style="margin:0;">
            <input type="hidden" name="friend_id" value="{{ f.pseudo }}">
            <button type="submit" class="delete-btn" title="Supprimer" aria-label="Supprimer l'ami">&times;</button>
        </form>
    </div>
    <div class="post-content">
    </div>
</div>

{% endfor %}

<h3>Ajouter un ami</h3>

{% if error %}
<div class="error">{{ error }}</div>
{% endif %}

<form method="post" action="/add_friend">
  <input name="pseudo" placeholder="Pseudo">
  <button class="button-blue type="submit">Ajouter</button>
</form>

{% endblock %}
